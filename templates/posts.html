{% extends 'base.html' %}

{% block content %}
<style>
    /* 1. Main Container Setup */
    .universe-container {
        background: #000;
        min-height: 100vh;
        padding: 40px 20px;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* 2. The 3x3 Grid */
    .universe-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 1px; /* Creates the thin black lines between cards */
        width: 100%;
        max-width: 1200px;
        background-color: #000; /* Border color */
        border: 1px solid #000;
    }

    /* 3. The Individual Card */
    .grid-card {
        position: relative;
        height: 280px;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background-color: var(--card-color);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        transition: all 0.5s ease;
    }

    /* 4. Background Pattern (The Math Scribbles) */
    .grid-card::before {
        content: "";
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: url("https://www.transparenttextures.com/patterns/gplay.png");
        opacity: 1;
        mix-blend-mode: overlay;
        transition: opacity 0.3s ease;
    }

    /* 5. Card Text */
    .grid-card h2 {
        color: rgba(255, 255, 255, 0.85);
        font-family: 'Inter', sans-serif;
        font-weight: 300;
        font-size: 1.5rem;
        letter-spacing: 0.5px;
        z-index: 2;
        transition: all 0.3s ease;
        position: relative;
    }

    .grid-card h2::after {
        content: '';
        position: absolute;
        bottom: -10px;
        left: 50%;
        width: 0;
        height: 2px;
        background: var(--card-color);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        transform: translateX(-50%);
    }

    .grid-card:hover h2::after {
        width: 80%; /* Line expands outwards on hover */
    }

    /* 6. HOVER EFFECTS */
    .grid-card:hover {
        z-index: 10;
        /* Slight lift and glow */
        box-shadow: inset 0 0 100px rgba(0,0,0,0.5), 0 0 30px var(--card-color);
        transform: scale(1.02);
    }

    .grid-card:hover h2 {
        color: #fff;
        transform: scale(1.1);
        text-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    .grid-card:hover::before {
        opacity: 0.4; /* Pattern becomes more visible on hover */
    }

    /* Mobile Responsive */
    @media (max-width: 900px) {
        .universe-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }
    @media (max-width: 600px) {
        .universe-grid {
            grid-template-columns: 1fr;
        }
    }
</style>

<div class="universe-container">
    <div class="universe-grid">
        {% for key, data in graph_data.items() %}
            <a href="{{ url_for('show_graph', category=key) }}"
               class="grid-card"
               style="--card-color: {{ data.color }};">
                <h2>{{ data.title }}</h2>
            </a>
        {% endfor %}
    </div>
</div>

{% endblock %}
