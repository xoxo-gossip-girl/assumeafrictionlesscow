{% extends 'base.html' %}
{% block content %}
<div id="blog-graph"></div>

<script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>

<style>
    #blog-graph {
        width: 100%;
        height: 400px;
        border: 1px solid #eee;
        border-radius: 8px;
    }
</style>

<script>
    // 1. HARDCODE YOUR POSTS HERE
    var nodes = new vis.DataSet([
        { id: 1, label: 'Intro to Flask', color: '#97c2fc' },
        { id: 2, label: 'Python Basics', color: '#97c2fc' },
        { id: 3, label: 'HTML Guide', color: '#97c2fc' },
        // To add a new post, just add a line like this:
        // { id: 4, label: 'My New Post', color: '#97c2fc' }
    ]);

    // 2. HARDCODE THE CONNECTIONS HERE
    var edges = new vis.DataSet([
        { from: 1, to: 2 }, // Connects Flask to Python
        { from: 1, to: 3 }, // Connects Flask to HTML
    ]);

    var container = document.getElementById('blog-graph');
    var data = { nodes: nodes, edges: edges };

    var options = {
        nodes: {
            shape: 'dot',
            size: 16,
            font: { face: 'Helvetica', size: 14 }
        },
        physics: {
            enabled: true,
            barnesHut: { gravitationalConstant: -2000 }
        },
        interaction: { dragNodes: true, zoomView: false } // Allows moving nodes but keeps the view stable
    };

    var network = new vis.Network(container, data, options);
</script>
{% endblock %}
