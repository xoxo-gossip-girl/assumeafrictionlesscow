{% extends 'base.html' %}
{% block content %}
<head>
    <style>
        /* 1. Global Reset & Theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000; /* Matching your black background */
            color: #fff;
            font-family: 'Times New Roman', serif; /* Matching the academic header style */
        }

        /* The specific <a> tag reset we discussed */
        a {
            text-decoration: none;
            color: inherit;
        }

        /* 2. Header & Nav (Matches your screenshots) */
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 1px solid #d4af37; /* The gold line in your image */
        }

        nav {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 30px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #d4af37; /* Gold nav text */
            text-transform: uppercase;
        }

        .main-title {
            font-size: 4rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .subtitle {
            font-style: italic;
            color: #888;
            font-size: 1.1rem;
        }

        /* 3. Hero Section for Main Page */
        .hero-container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            align-items: center;
            gap: 40px;
        }

        .hero-text h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #fff;
        }

        .hero-text p {
            font-size: 1.2rem;
            color: #ccc;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        /* Call to Action Button */
        .cta-box {
            display: inline-block;
            padding: 15px 40px;
            border: 1px solid #d4af37;
            color: #d4af37;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .cta-box:hover {
            background: #d4af37;
            color: #000;
        }

        .featured-image {
            width: 100%;
            height: 400px;
            background: #1a1a1a; /* Placeholder for a cool physics graphic */
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <main class="hero-container">
        <div class="hero-text">
            <h2>Physics, simplified.</h2>
            <p>Welcome to the laboratory. We ignore air resistance, friction, and reality just enough to make the math work out beautifully. Dive into our latest deep-dives and Olympiad prep materials.</p>
            <a href="categories.html" class="cta-box">Explore Categories</a>
        </div>

        <div class="featured-image">
            <span style="font-size: 5rem;">🐄</span>
        </div>
    </main>

</body>
{% endblock %}
